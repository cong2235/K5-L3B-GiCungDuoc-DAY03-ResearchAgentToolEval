# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >
      Hỏi người dùng MỘT câu. Dùng khi (a) thiếu thông tin bắt buộc như
      handle hoặc URL -> response_type="text"; (b) người dùng yêu cầu gửi/đăng
      thứ gì đó -> response_type="yes_no" để xác nhận trước khi gửi, kể cả khi
      chưa rõ nội dung. KHÔNG dùng khi người dùng đã đưa URL hoặc đã nêu đủ
      thông tin để gọi tool khác (đọc/tìm kiếm không cần xác nhận).
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Một câu hỏi ngắn, cùng ngôn ngữ người dùng."}
        response_type:
          type: string
          enum: [text, yes_no, choice]
          description: "BẮT BUỘC điền. text = xin thông tin thiếu (handle, URL); yes_no = xác nhận trước khi gửi/đăng; choice = chọn trong options."
        options: {type: array, default: [], items: {type: string}, description: "Chỉ dùng khi response_type=choice."}
      required: [question, response_type]

  - name: timeline
    description: >
      Lấy các bài đăng gần đây CỦA MỘT tài khoản cụ thể trên X/Twitter.
      DÙNG khi người dùng muốn tweet của một người/tổ chức đã nêu tên.
      KHÔNG dùng khi tìm theo chủ đề (dùng social_search); KHÔNG dùng nếu
      chưa biết tài khoản nào (hỏi lại bằng clarify).
    parameters:
      type: object
      properties:
        screenname:
          type: string
          default: ""
          description: >
            Handle X, KHÔNG có dấu @, chữ thường. Đổi tên người nổi tiếng
            thành handle: Sam Altman→sama, Elon Musk→elonmusk,
            Andrej Karpathy→karpathy. Nếu không chắc handle thì hỏi lại.
        limit:
          type: integer
          default: 5
          description: "Số tweet. Lấy đúng số người dùng nói ('10 tweet'→10, 'mới nhất' không nêu số→1)."
      required: [screenname]

  - name: social_search
    description: >
      Tìm tweet/bài đăng mạng xã hội THEO CHỦ ĐỀ hoặc từ khóa ("mọi người
      nói gì về X"). KHÔNG dùng để lấy tweet của một tài khoản (dùng timeline);
      KHÔNG dùng cho tin tức báo chí (dùng lookup).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chủ đề ngắn gọn, vd 'GPT-5', 'AI'."}
        search_type:
          type: string
          enum: [Latest, Top]
          default: "Latest"
          description: "Top khi người dùng nói 'phổ biến/top/hot nhất'; còn lại Latest."
        limit: {type: integer, default: 5, description: "Số tweet."}
      required: [query]

  - name: lookup
    description: >
      Tìm trên web (tin tức, thông tin). DÙNG cho tin thời sự, tin tức báo chí
      và tra cứu web. KHÔNG dùng khi đã có URL cụ thể (dùng fetch); KHÔNG dùng
      cho tweet (dùng social_search/timeline).
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Chỉ chủ đề cốt lõi, ngắn (vd 'AI', 'robotics', 'OpenAI'). KHÔNG thêm chữ 'news', 'tin tức', 'hôm nay' vào query."
        topic:
          type: string
          enum: [general, news]
          default: "general"
          description: "Đặt 'news' cho mọi yêu cầu tin tức/tin mới/nổi bật. 'general' chỉ cho tra cứu kiến thức."
        timeframe:
          type: string
          enum: [day, week, month, year]
          default: "week"
          description: "'hôm nay'→day, 'tuần này'→week, 'tháng này'→month, 'năm nay'→year."
        max_results: {type: integer, default: 5, description: "Số kết quả."}
      required: [query]

  - name: fetch
    description: >
      Đọc nội dung của MỘT URL mà người dùng đã đưa. Đây là thao tác CHỈ ĐỌC,
      gọi ngay, KHÔNG cần xác nhận. KHÔNG tự đoán/bịa URL (thiếu link thì dùng
      clarify response_type=text). KHÔNG dùng để tìm kiếm.
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ, đúng nguyên văn người dùng đưa."}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >
      Gửi/đăng văn bản lên Telegram. LÀ HÀNH ĐỘNG GHI, KHÔNG THU HỒI ĐƯỢC.
      Chỉ gọi sau khi đã hỏi clarify response_type=yes_no và người dùng trả lời
      đồng ý ở lượt sau. KHÔNG dùng để trả lời câu hỏi hay yêu cầu ngoài phạm vi.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung chính xác sẽ được gửi."}
        confirmed: {type: boolean, default: false, description: "true CHỈ khi người dùng đã đồng ý rõ ràng ở lượt trước."}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team tools (public APIs, no key) ----------------
  - name: hackernews
    description: >-
      Search Hacker News stories (tech community discussion, points, comments).
      USE when the user mentions Hacker News / HN / "dân tech bàn gì trên HN".
      DO NOT use for general web news (use lookup) or Twitter (use social_search).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Core keyword only, e.g. 'LLM agents'."}
        sort: {type: string, enum: [relevance, date], default: "relevance", description: "date = newest stories (mới nhất); relevance = best match/popular."}
        limit: {type: integer, default: 5, description: "Number of stories; the number the user asked for, otherwise 5."}
      required: [query]

  - name: wikipedia
    description: >-
      Get the encyclopedia intro of a concept, person, company or technology from Wikipedia.
      USE for background/definitions: "X là gì", "giới thiệu về X", "ai là X".
      DO NOT use for recent news (use lookup) or when you can answer a trivial question directly.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Article subject, e.g. 'Transformer (deep learning)', 'Andrej Karpathy'."}
        lang: {type: string, enum: [en, vi], default: "en", description: "vi only if the user asks for the Vietnamese Wikipedia article; otherwise en."}
      required: [query]

  - name: openalex
    description: >-
      Find scholarly papers by AUTHOR NAME and/or TOPIC (OpenAlex: all venues, citation counts).
      USE when the user NAMES AN AUTHOR: "bài báo của <tác giả>", "tác giả X viết gì về Y".
      DO NOT use for a topic-only ranking such as "top / trích dẫn nhiều nhất về <chủ đề> trong N tháng qua" (use top_papers),
      for the newest arXiv preprints by keyword (use papers), or for news (use lookup).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Topic keywords only, e.g. 'retrieval-augmented generation'. Leave empty when the user only names an author."}
        author: {type: string, default: "", description: "Author full name as the user wrote it, e.g. 'Geoffrey Hinton'. Leave empty when searching by topic only."}
        sort: {type: string, enum: [cited, recent], default: "cited", description: "cited = most cited / quan trọng nhất (default); recent = newest / mới nhất."}
        limit: {type: integer, default: 5, description: "Number of papers; the number the user asked for, otherwise 5."}
      required: []

  # ---------------- Team tool (CP3) ----------------
  - name: top_papers
    description: >-
      Trả về danh sách bài báo ĐÃ XUẤT BẢN trên tạp chí (journal) và/hoặc hội nghị (conference)
      trong N tháng gần đây, xếp hạng theo số trích dẫn, độ liên quan hoặc mới nhất.
      DÙNG khi user hỏi "top / nổi bật / được trích dẫn nhiều nhất / có ảnh hưởng nhất / mới nhất"
      về bài báo, paper trên tạp chí, hội nghị trong một khoảng thời gian.
      KHÔNG DÙNG cho preprint arXiv (dùng `papers`), đọc nội dung một paper (dùng `paper_text`),
      hay tin tức AI (dùng `lookup`).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề/từ khóa tiếng Anh, ví dụ 'AI agents', 'large language models'. Để rỗng nếu user không nêu chủ đề."}
        months: {type: integer, default: 9, description: "Số tháng tính lùi từ hôm nay (1-24). '9 tháng qua' -> 9, 'nửa năm' -> 6, 'một năm' -> 12. User không nói -> 9."}
        limit: {type: integer, default: 10, description: "Số bài trả về (1-25). 'top 5' -> 5, 'top 20' -> 20. User không nói -> 10."}
        venue_type: {type: string, enum: [all, journal, conference], default: "all", description: "'journal' nếu user chỉ muốn tạp chí, 'conference' nếu chỉ hội nghị, 'all' nếu cả hai hoặc không nói."}
        sort_by: {type: string, enum: [citations, relevance, newest], default: "citations", description: "'citations' = trích dẫn nhiều nhất / top / có ảnh hưởng (mặc định); 'relevance' = liên quan nhất tới chủ đề (cần query); 'newest' = mới đăng gần đây nhất."}
        source: {type: string, enum: [openalex, semantic_scholar], default: "openalex", description: "Nguồn dữ liệu. Mặc định 'openalex'; chỉ dùng 'semantic_scholar' khi user yêu cầu rõ Semantic Scholar."}
      required: [query]

  - name: paper_references
    description: >-
      Liệt kê TÀI LIỆU THAM KHẢO (references / bibliography) của MỘT bài báo, từ tài liệu số [start]
      tới [end], kèm vị trí trang + dòng của từng tài liệu trong PDF.
      DÙNG khi user hỏi "bài này trích dẫn những gì / tài liệu tham khảo / references / reference số mấy
      tới số mấy" của một paper cụ thể.
      KHÔNG DÙNG để tìm paper mới (dùng `papers` hoặc `top_papers`) hay đọc nội dung bài (dùng `paper_text`).
      Nếu user không nói rõ là paper nào thì hỏi lại bằng `clarify`.
    parameters:
      type: object
      properties:
        paper: {type: string, default: "", description: "arXiv ID hoặc URL (ví dụ '1706.03762'), DOI, OpenAlex ID, hoặc tiêu đề bài báo."}
        start: {type: integer, default: 1, description: "Số thứ tự tài liệu đầu tiên cần lấy (>= 1). 'từ [5]' -> 5. Không nói -> 1."}
        end: {type: integer, default: 20, description: "Số thứ tự tài liệu cuối cùng (tối đa start+49). 'tới [10]' -> 10, '5 tài liệu đầu' -> 5. Không nói -> 20."}
        source: {type: string, enum: [arxiv_pdf, openalex], default: "arxiv_pdf", description: "'arxiv_pdf' khi có arXiv ID/URL (giữ đúng số [1],[2] và có trang/dòng); 'openalex' khi chỉ có DOI hoặc tiêu đề."}
      required: [paper]
